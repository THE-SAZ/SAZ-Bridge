<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="xpBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0058E6"/>
      <stop offset="8%" stop-color="#3A93FF"/>
      <stop offset="40%" stop-color="#0054E3"/>
      <stop offset="88%" stop-color="#0046CA"/>
      <stop offset="100%" stop-color="#003DB8"/>
    </linearGradient>
    <linearGradient id="xpGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="51%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="xpGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B6E664"/>
      <stop offset="50%" stop-color="#7FBA00"/>
      <stop offset="100%" stop-color="#4C8B00"/>
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feMerge><feMergeNode in="off"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Window frame -->
  <g filter="url(#shadow)">
    <rect x="8" y="20" width="240" height="216" rx="8" fill="url(#xpBlue)"/>
    <rect x="8" y="20" width="240" height="30" rx="8" fill="url(#xpBlue)"/>
    <rect x="8" y="42" width="240" height="8" fill="url(#xpBlue)"/>
    <rect x="8" y="20" width="240" height="30" fill="url(#xpGloss)" rx="8"/>
  </g>

  <!-- Title bar text -->
  <circle cx="22" cy="35" r="5" fill="url(#xpGreen)"/>
  <text x="34" y="39" font-family="Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#fff">SAZ Bridge</text>

  <!-- Window controls -->
  <rect x="222" y="29" width="18" height="14" rx="2" fill="url(#xpBlue)" stroke="#fff" stroke-opacity="0.4"/>
  <line x1="226" y1="38" x2="236" y2="38" stroke="#fff" stroke-width="1.5"/>
  <rect x="200" y="29" width="18" height="14" rx="2" fill="url(#xpBlue)" stroke="#fff" stroke-opacity="0.4"/>
  <rect x="204" y="32" width="10" height="8" fill="none" stroke="#fff" stroke-width="1"/>
  <rect x="178" y="29" width="18" height="14" rx="2" fill="#C33" stroke="#fff" stroke-opacity="0.4"/>
  <line x1="182" y1="33" x2="192" y2="42" stroke="#fff" stroke-width="1.5"/>
  <line x1="192" y1="33" x2="182" y2="42" stroke="#fff" stroke-width="1.5"/>

  <!-- Window body -->
  <rect x="9" y="53" width="238" height="182" fill="#ECE9D8"/>

  <!-- Bridge artwork inside -->
  <rect x="20" y="70" width="216" height="140" fill="#fff" stroke="#ACA899"/>
  <g fill="none" stroke="#0054E3" stroke-linecap="round" stroke-width="6">
    <path d="M50 170 Q128 80 206 170"/>
    <path d="M40 185 L216 185"/>
    <line x1="80" y1="135" x2="80" y2="185" stroke-width="4"/>
    <line x1="128" y1="88" x2="128" y2="185" stroke-width="4"/>
    <line x1="176" y1="135" x2="176" y2="185" stroke-width="4"/>
  </g>
  <circle cx="128" cy="88" r="7" fill="#7FBA00" stroke="#fff" stroke-width="2"/>
</svg>